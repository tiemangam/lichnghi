<!DOCTYPE html>
<html lang="vi">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Gặm · phong cách Cộng: giấy kem, xanh rêu, đỏ ớt, chữ đứng hẹp + chữ máy đánh */
:root{
  --kem:#EFE6D2; --kem2:#F7EFDC; --giay:#FBF5E6; --xanh:#445803; --xanh2:#34440A; --xanhNhat:#E2E2C4;
  --do:#B11002; --vang:#F2C230; --muc:#2A2216; --muc2:#6E604A; --vien:#CDBF9E; --vienDam:#3B3220;
  --H:'Anton','Be Vietnam Pro',sans-serif; --M:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,input,textarea,a,[data-act],[data-tab]{touch-action:manipulation}
input,textarea,select{font-size:16px!important}
html,body{margin:0;color:var(--muc);font:15px/1.45 'Be Vietnam Pro',system-ui,sans-serif}
body{background-color:var(--kem);background-image:radial-gradient(rgba(68,88,3,.07) 1px,transparent 1.2px);background-size:7px 7px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
/* đầu trang */
.top{background:var(--xanh);color:#F8E8C4;padding:12px 14px 0;position:sticky;top:0;z-index:20;
  background-image:radial-gradient(rgba(248,232,196,.08) 1px,transparent 1.3px);background-size:6px 6px;border-bottom:3px solid var(--do)}
.brand{display:flex;align-items:flex-end;gap:10px}
.logo{font:400 34px/.9 var(--H);letter-spacing:1px;text-transform:uppercase}
.sub{font:500 10.5px/1.25 var(--M);letter-spacing:1.2px;text-transform:uppercase;opacity:.9;border-left:2px solid var(--do);padding-left:8px;margin-bottom:2px}
.stamp{margin-left:auto;align-self:center;font:600 9px/1 var(--M);letter-spacing:1px;text-transform:uppercase;color:#F8E8C4;border:1.5px dashed rgba(248,232,196,.55);border-radius:50%;width:50px;height:50px;display:grid;place-items:center;text-align:center;transform:rotate(-10deg);opacity:.7}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid rgba(248,232,196,.5);background:transparent;color:#F8E8C4;border-radius:3px;padding:7px 11px;font:600 12px/1 var(--M);letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.tab.on{background:#F8E8C4;color:var(--xanh);border-color:#F8E8C4;box-shadow:2px 2px 0 var(--do)}
.tab.tong{border-style:dashed}
main{max-width:640px;margin:0 auto;padding:14px 12px 200px}
/* thẻ giấy */
.card{background:var(--giay);border:1.5px solid var(--vienDam);border-radius:4px;padding:12px;box-shadow:3px 3px 0 rgba(68,88,3,.22)}
.row{display:flex;align-items:center;gap:8px}
.daynav{display:flex;align-items:center;gap:6px}
.icon{width:38px;height:38px;border-radius:4px;border:1.5px solid var(--vienDam);background:var(--kem2);font-size:18px;line-height:1;display:grid;place-items:center;padding:0;color:var(--xanh)}
input[type=date]{height:38px;border:1.5px solid var(--vienDam);border-radius:4px;padding:0 8px;background:var(--kem2);min-width:0;flex:1;font-family:var(--M)}
.thu{font:400 20px/1 var(--H);color:var(--do);min-width:34px;text-align:center;letter-spacing:.5px}
.lnk{background:none;border:0;color:var(--xanh);font:600 12.5px var(--M);padding:6px 4px;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.lnk.do{color:var(--do)}
.field{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.field label{font:600 11px var(--M);letter-spacing:1px;text-transform:uppercase;color:var(--muc2)}
.inp{height:42px;border:1.5px solid var(--vien);border-radius:4px;padding:0 10px;background:#FFFCF4;width:100%}
.inp:focus,.ln input:focus{outline:2px solid var(--xanh);outline-offset:-1px;border-color:var(--xanh)}
.inp[readonly]{background:var(--kem2)}
.status{font:500 12px var(--M);margin-top:10px;color:var(--muc2);border-top:1px dashed var(--vien);padding-top:8px}
.status b{font-weight:700}
.st-ok{color:var(--xanh)} .st-warn{color:var(--do)} .st-wait{color:#A0700F}
.plist{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pchip{border:1px solid var(--vienDam);background:var(--kem2);border-radius:3px;padding:4px 9px;font:500 12px var(--M)}
.pchip.on{background:var(--xanh);color:#F8E8C4;border-color:var(--xanh)}
/* tiêu đề mục: chữ đứng hẹp + vạch đỏ */
h3{font:400 19px/1.1 var(--H);letter-spacing:.6px;text-transform:uppercase;color:var(--xanh);margin:20px 2px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
h3:before{content:"";width:4px;height:18px;background:var(--do);margin-right:2px;flex:none}
h3{justify-content:flex-start}
h3 small,h3 .lnk{margin-left:auto}
h3 small{font:500 10.5px var(--M);letter-spacing:.3px;text-transform:none;color:var(--muc2)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--xanh);color:var(--xanh);background:#FFFCF4;border-radius:3px;padding:7px 10px;font-size:13.5px;font-weight:600;display:inline-flex;gap:6px;align-items:center;box-shadow:2px 2px 0 rgba(68,88,3,.25)}
.chip i{font:500 11.5px var(--M);color:var(--do)}
.chip.all{background:var(--xanh);color:#F8E8C4}
.chip.all i{color:var(--vang)}
.chip:active{transform:translate(2px,2px);box-shadow:none}
.search{position:relative;margin-top:14px}
.search .inp{height:48px;font-size:16px;padding-left:40px;border:2px solid var(--xanh);background:#FFFCF4;box-shadow:3px 3px 0 rgba(68,88,3,.22)}
.search .mag{position:absolute;left:13px;top:13px;font-size:17px;opacity:.6;pointer-events:none}
.sug{position:absolute;left:0;right:0;top:52px;background:#FFFCF4;border:1.5px solid var(--vienDam);border-radius:4px;box-shadow:4px 4px 0 rgba(42,34,22,.18);z-index:30;overflow:hidden;display:none}
.sug.on{display:block}
.sg{display:flex;justify-content:space-between;gap:8px;padding:11px 12px;border-bottom:1px dashed var(--vien)}
.sg:last-child{border-bottom:0}
.sg.act,.sg:active{background:var(--xanhNhat)}
.sg b{font-weight:600}
.sg span{color:var(--muc2);font:500 12px var(--M);white-space:nowrap}
.sg.new b{color:var(--do)}
/* dòng món như phiếu viết tay */
.lines{margin-top:8px;display:flex;flex-direction:column;gap:8px}
.ln{background:#FFFCF4;border:1px solid var(--vien);border-left:4px solid var(--xanh);border-radius:3px;padding:8px}
.ln.flash{animation:fl 1s}
@keyframes fl{0%{background:#FBE7A6}100%{background:#FFFCF4}}
.ln-top{display:flex;align-items:center;gap:6px}
.no{width:24px;height:24px;border-radius:3px;background:var(--xanh);color:#F8E8C4;font:600 11.5px var(--M);display:grid;place-items:center;flex:none}
.ln input{border:1px solid var(--vien);border-radius:3px;height:36px;padding:0 8px;background:var(--kem2);min-width:0;width:100%;font-family:var(--M);font-size:15px}
.ln .f-ten{border-color:transparent;background:transparent;font:600 15.5px 'Be Vietnam Pro',system-ui,sans-serif;padding:0 4px}
.ln .f-ten:focus{background:var(--kem2)}
.x{flex:none;width:32px;height:32px;border:0;background:none;color:var(--do);font-size:22px}
.ln-bot{display:grid;grid-template-columns:1fr .8fr auto 1.1fr auto 1.25fr;gap:5px;align-items:center;margin-top:6px}
.ln-bot .op{color:var(--muc2);font:500 13px var(--M)}
.ln-bot .f-tien{font-weight:700;color:var(--xanh);text-align:right;background:var(--xanhNhat);border-color:transparent}
.ln-bot .f-gia{text-align:right}
.hint{font:600 10px var(--M);letter-spacing:.8px;text-transform:uppercase;color:var(--muc2);display:grid;grid-template-columns:1fr .8fr auto 1.1fr auto 1.25fr;gap:5px;padding:0 9px 0 12px;margin-top:10px}
.hint span:nth-child(4),.hint span:nth-child(6){text-align:right}
.empty{text-align:center;color:var(--muc2);padding:20px 10px;font:500 12.5px/1.6 var(--M);border:1.5px dashed var(--vien);border-radius:4px;margin-top:10px;background:rgba(251,245,230,.6)}
table.view{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
table.view th{font:600 10px var(--M);text-transform:uppercase;letter-spacing:1px;color:var(--muc2);text-align:left;padding:6px 4px;border-bottom:2px solid var(--xanh)}
table.view td{padding:9px 4px;border-bottom:1px dashed var(--vien);vertical-align:top}
table.view td.r,table.view th.r{text-align:right;white-space:nowrap;font-family:var(--M)}
table.view td.n{color:var(--muc2);width:22px;font-family:var(--M)}
table.view td small{color:var(--muc2)}
/* thanh dưới: dải xanh như poster hai tầng */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--giay);border-top:2px solid var(--vienDam);box-shadow:0 -6px 20px rgba(42,34,22,.10);z-index:25;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.bar-in{max-width:640px;margin:0 auto}
.sum{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tongbox{font:600 10.5px var(--M);letter-spacing:1px;color:var(--muc2);text-transform:uppercase;border-left:4px solid var(--do);padding-left:9px}
.tongbox b{display:block;font:400 30px/1.05 var(--H);color:var(--xanh);letter-spacing:.5px;text-transform:none}
.gc{display:flex;align-items:center;gap:8px}
.gc .inp{width:94px;height:40px;text-align:right;font:700 15px var(--M)}
.gc label{font:600 10px/1.3 var(--M);letter-spacing:.6px;text-transform:uppercase;color:var(--muc2)}
.du{font:700 12.5px var(--M);padding:5px 9px;border-radius:3px;white-space:nowrap}
.du.ok{background:var(--xanh);color:#F8E8C4} .du.am{background:var(--do);color:var(--vang)}
.btns{display:grid;grid-template-columns:1fr 1.4fr 1.2fr;gap:8px;margin-top:10px}
.btn{height:48px;border-radius:4px;border:2px solid var(--xanh);background:#FFFCF4;color:var(--xanh);font:700 14.5px 'Be Vietnam Pro',system-ui,sans-serif;box-shadow:3px 3px 0 rgba(68,88,3,.3)}
.btn.pri{background:var(--xanh);color:#F8E8C4;font:400 19px/1 var(--H);letter-spacing:1px;text-transform:uppercase;box-shadow:3px 3px 0 var(--do)}
.btn:disabled{opacity:.4;box-shadow:none}
@media (max-width:380px){.btn{font-size:13.5px;padding:0 4px}.btn.pri{font-size:17px}.tongbox b{font-size:26px}.logo{font-size:30px}}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(68,88,3,.3)}
.toast{position:fixed;left:50%;bottom:160px;transform:translateX(-50%);background:var(--xanh);color:#F8E8C4;padding:10px 16px;border-radius:3px;border-left:4px solid var(--do);font:500 13px var(--M);z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center;box-shadow:3px 3px 0 rgba(42,34,22,.25)}
.toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(42,34,22,.6);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:var(--kem);background-image:radial-gradient(rgba(68,88,3,.07) 1px,transparent 1.2px);background-size:7px 7px;width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:6px 6px 0 0;border-top:4px solid var(--xanh);padding:16px 14px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{font:400 24px/1.1 var(--H);letter-spacing:.6px;text-transform:uppercase;margin:0 0 10px;color:var(--xanh);display:flex;justify-content:space-between;align-items:center;gap:10px}
.hi{display:flex;justify-content:space-between;gap:10px;padding:11px 12px;background:var(--giay);border:1px solid var(--vien);border-left:4px solid var(--xanh);border-radius:3px;margin-bottom:6px;width:100%;text-align:left;align-items:center}
.hi small{color:var(--muc2);display:block;font:500 11.5px var(--M)}
.hi b{white-space:nowrap;font-family:var(--M)}
.hi .lnk{padding:2px 6px}
.imgwrap{background:#FFFCF4;border:1px solid var(--vien);border-radius:4px;padding:6px;text-align:center}
.imgwrap img{max-width:100%;border-radius:2px;display:block;margin:0 auto;-webkit-touch-callout:default}
.note{font:500 12px/1.55 var(--M);color:var(--muc2);margin:8px 2px}
.ttable{width:100%;border-collapse:collapse;margin-top:6px}
.ttable td{padding:12px 6px;border-bottom:1px dashed var(--vien)}
.ttable tr.click td{cursor:pointer}
.ttable td.r{text-align:right;font:700 14.5px var(--M);white-space:nowrap}
.ttable tr.total td{font-weight:800;border-top:2px solid var(--xanh);border-bottom:0;font-size:16px}
.ttable tr.total td:first-child{font:400 20px var(--H);letter-spacing:.5px;text-transform:uppercase;color:var(--xanh)}
.ttable tr.total td.r{color:var(--do);font-size:17px}
.muted{color:var(--muc2);font-weight:500}
.loading{padding:50px 20px;text-align:center;color:var(--muc2);font:500 13px var(--M);letter-spacing:1px;text-transform:uppercase}
::placeholder{color:#B5A786;opacity:1}
textarea.inp{height:auto;min-height:42px;padding:9px 10px;resize:vertical}
.foot{text-align:center;font:500 10px/1.6 var(--M);letter-spacing:1.2px;text-transform:uppercase;color:var(--muc2);opacity:.75;margin:26px 0 0}
</style>

<style>/* ảnh hóa đơn đi chợ: nhỏ gọn, chỉ để lưu cho anh Đạt xem */
.anhrow{display:flex;align-items:center;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.anhrow::-webkit-scrollbar{display:none}
.anhbtn{flex:none;border:1.5px dashed var(--xanh);color:var(--xanh);border-radius:3px;padding:6px 9px;font:600 12px var(--M);background:#FFFCF4;cursor:pointer;white-space:nowrap}
.anhbtn input{display:none}
.anhrow img,.anhrow .aph{flex:none;width:34px;height:34px;object-fit:cover;border-radius:3px;border:1px solid var(--vien);background:var(--kem2);display:grid;place-items:center;font-size:14px;padding:0}

<style>/* ===== CHỮ DỄ ĐỌC (12/11/2026): đồng bộ Sổ Quán – Baloo 2 + Be Vietnam Pro, bỏ chữ in hoa nhỏ + giãn thưa ===== */

<script>
(function(){
'use strict';
/* ---------- tiện ích ---------- */
var LS = {
  get: function(k){ try { return JSON.parse(localStorage.getItem('gamcho_'+k)); } catch(e){ return null; } },
  set: function(k,v){ try { localStorage.setItem('gamcho_'+k, JSON.stringify(v)); } catch(e){} },
  del: function(k){ try { localStorage.removeItem('gamcho_'+k); } catch(e){} }
};
var $ = function(s, r){ return (r||document).querySelector(s); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function norm(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/\s+/g,' ').trim(); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function isNum(v){ return v!=='' && v!=null && isFinite(v); }
function fmtN(n, dec){ return Number(n).toLocaleString('vi-VN',{maximumFractionDigits:dec==null?1:dec}); }
function fmtK(vnd){ return isNum(vnd) ? fmtN(vnd/1000) + 'k' : ''; }
function fmtD(vnd){ return fmtN(Math.round(vnd||0),0) + 'đ'; }
function inK(vnd){ return isNum(vnd) ? String(+(vnd/1000).toFixed(3)).replace('.',',') : ''; }
function inK1(vnd){ return isNum(vnd) ? String(+(vnd/1000).toFixed(1)).replace('.',',') : ''; }
function inQ(q){ return isNum(q) ? String(+(+q).toFixed(3)).replace('.',',') : ''; }
function pMoney(s){
  s = String(s||'').replace(/[\sk]/gi,'');
  if (!s) return '';
  if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');
  else s = s.replace(',', '.');
  var n = parseFloat(s);
  return isFinite(n) ? Math.round(n*1000) : '';
}
function pQty(s){ s = String(s||'').trim().replace(',', '.'); if(!s) return ''; var n = parseFloat(s); return isFinite(n) ? n : ''; }
function addDays(s, n){ var p=s.split('-'); var d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]+n)); return d.toISOString().slice(0,10); }

function toast(msg, ms){ var t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove('on'); }, ms||1800); }
function run(fn, args, ok, fail){

  var r = google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){ fail && fail(e); });

}

B.danhMuc.forEach(function(d){ putDm(d.nhom, d); });

CFG.nhom.forEach(function(n){ ST.from[n] = B.tuNgay; });

function putDm(nhom, d){
  var k = norm(d.ten); if (!k) return;
  var map = ST.dm[nhom] || (ST.dm[nhom] = {});
  var words = k.split(' ');
  var cur = map[k];
  var it = { ten:d.ten, dv:d.dv||'', sl:d.sl, gia:d.gia, tien:d.tien||0, ngay:d.ngay||'', lan:d.lan||1, k:k, words:words, init:words.map(function(w){return w[0];}).join('') };
  if (cur && cur.ngay > it.ngay) { cur.lan = Math.max(cur.lan, it.lan); return; }
  map[k] = it;
}
function learn(p, oldNames){
  p.mon.forEach(function(m){
    var k = norm(m.ten), cur = (ST.dm[p.nhom]||{})[k];
    var lan = cur ? cur.lan + (oldNames[k] ? 0 : 1) : 1;
    if (cur && cur.ngay > p.ngay) { cur.lan = lan; return; }
    putDm(p.nhom, { ten:m.ten, dv:m.dv, sl:m.sl, gia:m.gia, tien:m.tien, ngay:p.ngay, lan:lan });
  });
}
function coGiaoCa(nhom){ return CFG.giaoCa.indexOf(nhom) >= 0; }
function listDay(nhom, ngay){
  return Object.keys(ST.phieu).map(function(id){ return ST.phieu[id]; })
    .filter(function(p){ return p.nhom===nhom && p.ngay===ngay; })
    .sort(function(a,b){ return a.id < b.id ? -1 : 1; });
}
function listGroup(nhom){
  return Object.keys(ST.phieu).map(function(id){ return ST.phieu[id]; })
    .filter(function(p){ return p.nhom===nhom; })
    .sort(function(a,b){ return a.ngay===b.ngay ? (a.id<b.id?1:-1) : (a.ngay<b.ngay?1:-1); });
}
function tong(p){ return p.mon.reduce(function(s,m){ return s + (+m.tien||0); }, 0); }
function lastBuyer(nhom){ var l = listGroup(nhom).filter(function(p){ return p.nguoiMua; }); return LS.get('buyer_'+nhom) || (l[0] ? l[0].nguoiMua : ''); }
function newPhieu(nhom, ngay){ return { id:newId(), ngay:ngay, nhom:nhom, nguoiMua:lastBuyer(nhom), tienNhan:'', ghiChu:'', mon:[], _new:true }; }

/* ---------- trạng thái mỗi nhóm ---------- */
function G(){ return ST.g[ST.tab]; }
function loadDay(nhom, ngay, id){
  var list = listDay(nhom, ngay), g = ST.g[nhom] || (ST.g[nhom] = {});
  var src = id ? ST.phieu[id] : list[0];

  if (src) { g.cur = clone(src); g.edit = (ngay === TODAY); }
  else { g.cur = newPhieu(nhom, ngay); g.edit = true; }
}
function saveDraft(){ var g=G(); if (g.edit && g.dirty) LS.set('draft_'+ST.tab, { cur:g.cur }); }
function dirty(){ var g=G(), was = g.dirty; g.dirty = true; saveDraft(); renderStatus(); if (!was) updEditBtn(); }
function canUndo(){ var g=G(), p=g.cur; return !!(g.edit && g.dirty && !p._new && ST.phieu[p.id]); }
function updEditBtn(){ var b = $('[data-act=edit]'); if (!b) return; var g=G(), u = canUndo(); b.disabled = g.edit && !u; b.textContent = u ? 'Hủy sửa' : '✎ Sửa'; }
function guard(fn){
  var g = G();
  if (g && g.edit && g.dirty && g.cur.mon.length) confirmBox('Phiếu đang nhập chưa lưu. Bỏ thay đổi?', 'Bỏ thay đổi', function(){ LS.del('draft_'+ST.tab); fn(); });

}
function openTab(nhom){
  ST.tab = nhom; LS.set('tab', nhom);
  if (nhom !== '__tong' && !ST.g[nhom]) {
    var d = LS.get('draft_'+nhom);
    if (d && d.cur && d.cur.mon && d.cur.mon.length) {
      ST.g[nhom] = { ngay:d.cur.ngay, cur:d.cur, edit:true, dirty:true };
      setTimeout(function(){ toast('Mở lại phiếu đang nhập dở'); }, 300);
    } else loadDay(nhom, TODAY);
  }
  render();
}

/* ---------- gợi ý ---------- */
function inCur(k){ return G().cur.mon.some(function(m){ return norm(m.ten)===k; }); }
function hayMua(nhom){
  var g = G(), map = ST.dm[nhom] || {}, hm = ST.hm[nhom] || {};
  var ps = listGroup(nhom).filter(function(p){ return p.id !== g.cur.id && p.ngay >= B.tuNgay; });
  var cnt = {}, auto = [];
  ps.forEach(function(p){ var seen={}; p.mon.forEach(function(m){ var k=norm(m.ten); if(!seen[k]){ seen[k]=1; cnt[k]=(cnt[k]||0)+1; } }); });
  if (ps.length >= 2) auto = Object.keys(cnt).filter(function(k){ return cnt[k] >= 2 && cnt[k]/ps.length >= 0.35 && map[k]; })
    .sort(function(a,b){ return cnt[b]-cnt[a] || map[b].lan-map[a].lan; });
  var ghim = Object.keys(hm).filter(function(k){ return hm[k].tt === 'Ghim'; });
  var keys = ghim.concat(auto.filter(function(k){ return ghim.indexOf(k) < 0; }))
    .filter(function(k){ return !(hm[k] && hm[k].tt === 'Ẩn'); });
  return keys.map(function(k){ return map[k] || { ten:hm[k].ten, dv:'', sl:'', gia:'', tien:'', k:k, lan:0, words:k.split(' '), init:'' }; });
}
function search(q){
  var nhom = ST.tab, qn = norm(q), qs = qn.replace(/ /g,''), toks = qn.split(' ');
  function score(it){
    if (!qn) return it.lan;
    var s = 0;
    if (it.k.indexOf(qn) === 0) s = 100;
    else if (it.words.some(function(w){ return w.indexOf(qn)===0; })) s = 85;
    else if (toks.length > 1 && toks.every(function(t){ return it.words.some(function(w){ return w.indexOf(t)===0; }); })) s = 75;
    else if (qs.length >= 2 && it.init.indexOf(qs) === 0) s = 70;
    else if (it.k.indexOf(qn) > 0) s = 40;
    return s ? s + Math.min(it.lan, 30) : 0;
  }
  var own = ST.dm[nhom] || {}, res = [];
  Object.keys(own).forEach(function(k){ var sc = score(own[k]); if (sc > 0) res.push({ it:own[k], s:sc, nhom:nhom }); });
  if (qn && res.length < 4) {
    Object.keys(ST.dm).forEach(function(n){ if (n===nhom) return;
      Object.keys(ST.dm[n]).forEach(function(k){ if (own[k] || res.some(function(r){ return r.it.k===k; })) return;
        var sc = score(ST.dm[n][k]); if (sc > 0) res.push({ it:ST.dm[n][k], s:sc-60, nhom:n }); }); });
  }
  res.sort(function(a,b){ return b.s - a.s; });
  var tot = res.filter(function(r){ return r.s >= 70; });
  return (tot.length ? tot : res).slice(0, 4);
}

  } else {

      p.mon.map(function(m,i){ return '<tr><td class="n">'+(i+1)+'</td><td>'+esc(m.ten)+'</td><td class="r">'+(isNum(m.sl)?inQ(m.sl)+' <small>'+esc(m.dv)+'</small>':'')+'</td><td class="r"><small>'+fmtK(m.gia)+'</small></td><td class="r"><b>'+fmtK(m.tien)+'</b></td></tr>'; }).join('')+

function renderStatus(){
  var el = $('#status'); if (!el) return;
  var g = G(), p = g.cur, rec = ST.phieu[p.id];
  var s;
  if (ST.pending[p.id]) s = '<span class="st-wait">⏳ Đang lưu lên Drive…</span>';
  else if (g.edit && g.dirty) s = '<span class="st-warn">● Chưa lưu</span> — nhập xong bấm <b>Lưu</b>';
  else if (g.edit && p._new) s = 'Phiếu mới cho '+THU_DAI[dow(g.ngay)]+' '+dm(g.ngay);
  else if (g.edit) s = rec && !rec._loi ? '<span class="st-ok">✓ Đã lưu</span>' + (rec.suaLuc ? ' · ' + esc(rec.suaLuc) : '') + ' — thêm món rồi bấm <b>Lưu</b>' : 'Đang sửa phiếu';

}

/* ---------- thao tác món ---------- */
function addItem(it){
  var g = G(), k = norm(it.ten);
  var idx = -1; g.cur.mon.forEach(function(m,i){ if (norm(m.ten)===k) idx = i; });
  if (idx >= 0) { flash(idx); toast('“'+it.ten+'” đã có trong phiếu'); return; }
  g.cur.mon.push({ ten:it.ten, sl:isNum(it.sl)?+it.sl:'', dv:it.dv||'', gia:isNum(it.gia)?+it.gia:'', tien:isNum(it.tien)?+it.tien:'' });
  dirty(); renderLines(); renderChips(); updTotals();
  flash(g.cur.mon.length-1);
}
function flash(i){ var el = document.querySelector('.ln[data-i="'+i+'"]'); if (el) { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); if (el.scrollIntoView) el.scrollIntoView({ block:'nearest' }); } }

/* ---------- ô tìm món ---------- */
var SUG = { list:[], act:0, q:'' };
function showSug(){
  var q = $('#q'); if (!q) return;
  if (!q.value.trim()) { SUG.list = []; hideSug(); return; }
  SUG.q = q.value; SUG.list = search(q.value); SUG.act = 0;
  var h = SUG.list.map(function(r,i){
    var it = r.it, info = (isNum(it.sl) ? inQ(it.sl)+' '+esc(it.dv)+' · ' : '') + fmtK(it.tien) + (r.nhom!==ST.tab ? ' · '+esc(r.nhom) : '') + (inCur(it.k) ? ' · ✓ đã có' : '');
    return '<div class="sg'+(i===0?' act':'')+'" data-si="'+i+'"><b>'+esc(it.ten)+'</b><span>'+info+'</span></div>';
  }).join('');
  var qt = q.value.trim();
  if (qt && !SUG.list.some(function(r){ return r.it.k.indexOf(norm(qt)) === 0; })) {
    h += '<div class="sg new'+(SUG.list.length?'':' act')+'" data-si="new"><b>+ Thêm món mới “'+esc(qt)+'”</b><span></span></div>';
  }
  var s = $('#sug'); s.innerHTML = h; s.classList.toggle('on', !!h);
}
function hideSug(){ var s = $('#sug'); if (s) s.classList.remove('on'); }
function pickSug(si){
  var q = $('#q'), qt = q.value.trim();
  if (si === 'new') {
    if (!qt) return;
    var ten = qt.charAt(0).toUpperCase() + qt.slice(1);
    addItem({ ten:ten, sl:'', dv:'', gia:'', tien:'' });
    q.value = ''; hideSug();
    var n = G().cur.mon.length - 1, el = document.querySelector('.ln[data-i="'+n+'"] .f-sl'); if (el) el.focus();
    return;
  }
  var r = SUG.list[si]; if (!r) return;
  addItem(r.it); q.value = ''; showSug(); q.focus();
}

/* ---------- sự kiện ---------- */
document.addEventListener('click', function(e){
  if (!e.target.isConnected) return;
  var t = e.target.closest('[data-tab],[data-act],[data-pid],[data-add],[data-del],[data-hid],[data-tday]');
  if (!t) { if (!e.target.closest('.search')) hideSug(); return; }
  if (t.dataset.tab) { var nt = t.dataset.tab; if (nt !== ST.tab) guardSwitch(function(){ openTab(nt); }); return; }
  if (t.dataset.pid) { var pid = t.dataset.pid; guard(function(){ loadDay(ST.tab, G().ngay, pid); render(); }); return; }
  if (t.dataset.add) { var k0 = t.dataset.add, it = (ST.dm[ST.tab]||{})[k0] || hayMua(ST.tab).filter(function(x){ return x.k === k0; })[0]; if (it) addItem(it); return; }
  if (t.dataset.del !== undefined) { G().cur.mon.splice(+t.dataset.del, 1); dirty(); renderLines(); renderChips(); updTotals(); return; }
  if (t.dataset.hid) { var h = ST.phieu[t.dataset.hid]; closeModal(); guard(function(){ goDay(h.nhom, h.ngay, h.id); }); return; }
  if (t.dataset.tday) { var gn = t.dataset.tday; ST.tab = gn; LS.set('tab', gn); if (!ST.g[gn]) loadDay(gn, TONG.ngay); guard(function(){ goDay(gn, TONG.ngay); }); return; }
  var a = t.dataset.act, g = G();
  if (a === 'prev' || a === 'next') guard(function(){ goDay(ST.tab, addDays(g.ngay, a==='prev'?-1:1)); });

/* ---------- đổi ngày / tải thêm ---------- */
function goDay(nhom, ngay, id){
  if (ngay < ST.from[nhom] && ST.from[nhom] !== '0000') {
    $('#main').innerHTML = '<div class="loading">Đang tải phiếu cũ…</div>';
    loadMore(nhom, function(){ goDay(nhom, ngay, id); }, ngay);
    return;
  }
  loadDay(nhom, ngay, id); render();
}
function loadMore(nhom, cb, toiNgay){
  run('apiLichSu', [nhom, ST.from[nhom], 60], function(ds){
    ds.forEach(function(p){ if (!ST.phieu[p.id]) ST.phieu[p.id] = p; });
    var min = ds.reduce(function(m,p){ return p.ngay < m ? p.ngay : m; }, ST.from[nhom]);
    ST.from[nhom] = ds.length < 60 ? '0000' : min;
    if (toiNgay && ST.from[nhom] !== '0000' && toiNgay < ST.from[nhom]) return loadMore(nhom, cb, toiNgay);
    cb();

}

  var old = ST.phieu[p.id], oldNames = {};

  var rec = clone(payload); rec.suaLuc = old ? old.suaLuc : '';

var IMG = { url:'', name:'', blob:null };
function ellipsis(ctx, s, w){ if (ctx.measureText(s).width <= w) return s; while (s.length > 1 && ctx.measureText(s+'…').width > w) s = s.slice(0,-1); return s+'…'; }

function drawImage(p, nhom, ngay){

  x.textAlign = 'right'; x.font = '700 19px '+FM; x.fillText(THU_DAI[dow(ngay)].toUpperCase() + ' · ' + dmy(ngay), W-32, 56);
  x.font = '500 16px '+FM; if (p.nguoiMua) x.fillText('Người mua: ' + p.nguoiMua, W-32, 92);
  x.fillText(p.mon.length + ' món', W-32, 128);

  });
  x.setLineDash([5,4]); x.strokeStyle = XANH; x.lineWidth = 1.5; x.beginPath(); x.moveTo(32, y+1); x.lineTo(W-32, y+1); x.stroke(); x.setLineDash([]);
  y += 26;
  // tổng: khối đỏ chữ vàng
  var t = tong(p);
  x.fillStyle = DO; x.fillRect(32, y, 6, 56);
  x.fillStyle = XANH; x.font = '700 40px '+FH; x.fillText('TỔNG CHI', 50, y+48);
  var tt = fmtD(t); x.font = '700 40px '+FH; var tw = x.measureText(tt).width + 44;
  x.fillStyle = 'rgba(42,34,22,.22)'; x.fillRect(W-32-tw+5, y+5, tw, 60);
  x.fillStyle = DO; x.fillRect(W-32-tw, y, tw, 60);
  x.fillStyle = VANG; x.textAlign = 'center'; x.fillText(tt, W-32-tw/2, y+48); x.textAlign = 'left';
  y += 84;
  if (gc) {
    var du = p.tienNhan - t;
    x.font = '500 18px '+FM; x.fillStyle = MUC;
    x.fillText('NHẬN GIAO CA', 32, y+28); x.textAlign = 'right'; x.font = '700 19px '+FM; x.fillText(fmtD(p.tienNhan), W-32, y+28); x.textAlign = 'left';
    x.font = '700 30px '+FH; x.fillStyle = du >= 0 ? XANH : DO;
    x.fillText(du >= 0 ? 'CÒN DƯ' : 'THIẾU', 32, y+74); x.textAlign = 'right'; x.fillText(fmtD(Math.abs(du)), W-32, y+74); x.textAlign = 'left';
    y += 96;
  }
  if (p.ghiChu) { x.font = '500 16px '+FM; x.fillStyle = MUC2; x.fillText(ellipsis(x, 'Ghi chú: ' + p.ghiChu, W-64), 32, y+28); y += 50; }
  // dải chân + con dấu
  x.fillStyle = XANH; x.fillRect(0, H-78, W, 78);
  x.fillStyle = KEM; x.font = '500 13.5px '+FM; x.textAlign = 'left';
  var rec = ST.phieu[p.id];
  x.fillStyle = DO; x.fillRect(32, H-56, 3, 36);
  x.fillStyle = KEM;
  x.fillText('TIỆM ĂN GẶM · 8/10 NGUYỄN THIỆN THUẬT, BÌNH THẠNH', 44, H-42);
  x.fillText(rec && rec.suaLuc ? 'Lưu lúc ' + rec.suaLuc : 'Phiếu chưa lưu', 44, H-22);
  x.save(); x.translate(W-96, H-128); x.rotate(-0.2); x.globalAlpha = .85;
  x.strokeStyle = DO; x.lineWidth = 3; x.beginPath(); x.arc(0,0,46,0,Math.PI*2); x.stroke();
  x.lineWidth = 1.2; x.setLineDash([3,3]); x.beginPath(); x.arc(0,0,38,0,Math.PI*2); x.stroke(); x.setLineDash([]);
  x.fillStyle = DO; x.textAlign = 'center'; x.font = '700 24px '+FH; x.fillText('GẶM', 0, 6); x.font = '600 9.5px '+FM; x.fillText('TỪ NĂM 2015', 0, 22);
  x.restore();

  IMG.name = 'Gam_' + norm(nhom).replace(/[^a-z0-9]+/g,'-') + '_' + ngay + '.png';
  IMG.url = c.toDataURL('image/png');
  IMG.blob = null;
  if (c.toBlob) c.toBlob(function(b){ IMG.blob = b; });
  var canShare = !!(navigator.canShare && window.File);
  openModal('<h2>Ảnh phiếu<button class="lnk" data-act="close">Đóng</button></h2>'+
    '<div class="imgwrap"><img src="'+IMG.url+'" alt="Phiếu chi"></div>'+
    '<div class="note">Nếu không thấy tải về: <b>nhấn giữ vào ảnh → Lưu ảnh / Tải ảnh xuống</b>, rồi gửi vào Zalo.</div>'+
    '<div class="btns" style="grid-template-columns:'+(canShare?'1fr 1fr':'1fr')+'">'+
    '<button class="btn pri" data-act="dl">⬇ Tải ảnh về máy</button>'+(canShare?'<button class="btn" data-act="share">↗ Gửi Zalo</button>':'')+'</div>');
  downloadImg();
}
function roundRect(x, a, b, w, h, r){ x.beginPath(); x.moveTo(a+r,b); x.arcTo(a+w,b,a+w,b+h,r); x.arcTo(a+w,b+h,a,b+h,r); x.arcTo(a,b+h,a,b,r); x.arcTo(a,b,a+w,b,r); x.closePath(); }
function downloadImg(){
  try { var a = document.createElement('a'); a.href = IMG.url; a.download = IMG.name; document.body.appendChild(a); a.click(); a.remove(); } catch(e){}
}
function shareImg(){
  var go = function(b){
    try {
      var f = new File([b], IMG.name, { type:'image/png' });
      if (navigator.canShare({ files:[f] })) navigator.share({ files:[f] }).catch(function(){});
      else toast('Máy không hỗ trợ — nhấn giữ ảnh để lưu', 3000);
    } catch(e){ toast('Nhấn giữ ảnh để lưu rồi gửi Zalo', 3000); }
  };
  if (IMG.blob) go(IMG.blob); else fetch(IMG.url).then(function(r){ return r.blob(); }).then(go);
}

/* ---------- ảnh hóa đơn đi chợ (nhỏ gọn: chụp lên là xong, anh Đạt xem trong Điều hành) ---------- */
var ANH = {};
function anhNen(file, max, q){
  return new Promise(function(ok, fail){
    var r = new FileReader();
    r.onload = function(){ var im = new Image(); im.onload = function(){
      var s = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * s); c.height = Math.round(im.height * s); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      ok(c.toDataURL('image/jpeg', q));
    }; im.onerror = function(){ fail(new Error('Ảnh lỗi')); }; im.src = r.result; };
    r.onerror = function(){ fail(new Error('Không đọc được ảnh')); }; r.readAsDataURL(file);
  });
}
function renderAnh(){
  var box = $('#anhRow'); if (!box || ST.tab === '__tong') return;
  var g = G(), p = g.cur, a = ANH[p.id];
  if (!a) { a = ANH[p.id] = { anh:[], thumbs:[], dang:0, tai:false };
    if (!p._new && ST.phieu[p.id]) { a.tai = true; run('apiAnhChoDs', [p.id], function(r){ a.tai = false; a.anh = r.anh || []; a.thumbs = r.thumbs || []; if (G().cur.id === p.id) renderAnh(); }, function(){ a.tai = false; }); } }
  var h = '<label class="anhbtn">📷 Ảnh HĐ<input type="file" accept="image/*" multiple id="anhF"></label>';
  h += a.anh.map(function(f, i){ var th = a.thumbs[i]; return th ? '<img data-ai="'+i+'" src="'+(th.indexOf('data:')===0?th:'data:image/jpeg;base64,'+th)+'" alt="">' : '<button class="aph" data-ai="'+i+'">🧾</button>'; }).join('');
  if (a.dang) h += '<small>⏳ đang gửi '+a.dang+' ảnh…</small>';
  else if (a.tai) h += '<small>…</small>';
  else h += '<small>'+(a.anh.length ? a.anh.length+' ảnh' : 'chụp hóa đơn chợ (nếu có)')+'</small>';
  box.innerHTML = h;
  $('#anhF').onchange = function(){ var fs = Array.prototype.slice.call(this.files || []); this.value = ''; anhGui(p, g.ngay, fs); };
  Array.prototype.forEach.call(box.querySelectorAll('[data-ai]'), function(el){ el.onclick = function(){ anhXem(p, +el.getAttribute('data-ai')); }; });
}
function anhGui(p, ngay, fs){
  if (!fs.length) return; var a = ANH[p.id];
  if (a.anh.length + fs.length > 12) { toast('Tối đa 12 ảnh mỗi phiếu'); fs = fs.slice(0, Math.max(0, 12 - a.anh.length)); if (!fs.length) return; }
  a.dang += fs.length; renderAnh();
  var mot = function(i){
    if (i >= fs.length) return;
    Promise.all([anhNen(fs[i], 1600, 0.8), anhNen(fs[i], 96, 0.6)]).then(function(r){
      run('apiAnhChoLuu', [{ id:p.id, ngay:ngay, nguoi:String(p.nguoiMua||'').trim(), them:[{ b64:r[0].split(',')[1], mime:'image/jpeg', thumb:r[1].split(',')[1] }] }], function(res){
        a.anh = res.anh || a.anh; a.thumbs = res.thumbs || a.thumbs; a.dang--; if (!a.dang) toast('✓ Đã lưu ảnh hóa đơn'); if (G().cur.id === p.id) renderAnh(); mot(i + 1);
      }, function(err){ a.dang = 0; toast('Gửi ảnh lỗi: ' + (err && err.message || err), 3500); if (G().cur.id === p.id) renderAnh(); });
    }, function(e){ a.dang--; toast(e.message); renderAnh(); mot(i + 1); });
  };
  mot(0);
}
function anhXem(p, i){
  var a = ANH[p.id], f = a.anh[i], th = a.thumbs[i];
  openModal('<h2>Ảnh hóa đơn '+(i+1)+'/'+a.anh.length+'<button class="lnk" data-act="close">Đóng</button></h2>' +
    (th ? '<div class="imgwrap"><img src="data:image/jpeg;base64,'+th+'" style="width:100%;max-width:320px;image-rendering:auto"></div>' : '') +
    '<div class="note">Ảnh đã lưu cho anh Đạt xem. Chụp nhầm thì xóa.</div><div class="btns" style="grid-template-columns:1fr 1fr"><button class="btn" data-act="close">Đóng</button><button class="btn pri" id="anhXoa" style="background:var(--do);border-color:var(--do)">Xóa ảnh</button></div>');
  $('#anhXoa').onclick = function(){ closeModal(); a.dang++; renderAnh();
    run('apiAnhChoLuu', [{ id:p.id, bo:[f] }], function(res){ a.dang--; a.anh = res.anh || []; a.thumbs = res.thumbs || []; toast('Đã xóa ảnh'); renderAnh(); }, function(err){ a.dang--; renderAnh(); toast('Xóa lỗi: ' + (err && err.message || err), 3500); }); };
}

/* ---------- khởi động ---------- */
var t0 = LS.get('tab');
openTab(CFG.nhom.indexOf(t0) >= 0 || t0 === '__tong' ? t0 : CFG.nhom[0]);
})();
</script>
